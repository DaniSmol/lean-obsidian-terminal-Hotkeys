name: Build node-pty binaries

on:
  workflow_call:
    inputs:
      node-pty-version:
        required: false
        type: string
        default: "1.1.0"
  workflow_dispatch:
    inputs:
      node-pty-version:
        description: "node-pty version to package"
        required: false
        default: "1.1.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-latest
            platform: win32
            arch: arm64
            use-prebuilt: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install node-pty
        shell: bash
        run: |
          mkdir staging && cd staging
          npm init -y
          npm install node-pty@${{ inputs.node-pty-version || '1.1.0' }}

      - name: Install node-pty for lib files
        if: matrix.use-prebuilt == true
        shell: bash
        run: |
          mkdir arm64-staging && cd arm64-staging
          npm init -y
          npm install node-pty@1.1.0

      - name: Package prebuilt ARM64 binaries
        if: matrix.use-prebuilt == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG=$RUNNER_TEMP/node-pty-pkg
          SRC=arm64-staging/node_modules/node-pty
          mkdir -p "$PKG/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}"

          # Copy JavaScript library files from npm installation
          mkdir -p "$PKG/lib"
          cp -r "$SRC/lib/"* "$PKG/lib/"
          cp "$SRC/package.json" "$PKG/"

          # Download prebuilt ARM64 binaries from the dedicated release asset
          # (Windows-ARM64 cannot be cross-built in CI; binaries are hosted as a
          # release asset instead of being tracked in the repo)
          gh release download arm64-prebuilds-v1 -R sdkasper/lean-obsidian-terminal \
            -p "arm64-prebuilds-${{ matrix.platform }}-${{ matrix.arch }}.zip" \
            -D "$RUNNER_TEMP" --clobber
          mkdir -p "$RUNNER_TEMP/arm64-prebuilds"
          unzip -o "$RUNNER_TEMP/arm64-prebuilds-${{ matrix.platform }}-${{ matrix.arch }}.zip" -d "$RUNNER_TEMP/arm64-prebuilds"

          # Copy prebuilt ARM64 binaries into the staged package
          if [ -d "$RUNNER_TEMP/arm64-prebuilds/${{ matrix.platform }}-${{ matrix.arch }}" ]; then
            cp -r "$RUNNER_TEMP/arm64-prebuilds/${{ matrix.platform }}-${{ matrix.arch }}"/* "$PKG/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/"
          else
            echo "ERROR: Prebuilt binaries not found in $RUNNER_TEMP/arm64-prebuilds/${{ matrix.platform }}-${{ matrix.arch }} after extracting release asset"
            exit 1
          fi

          # node-pty's native loader (useConptyDll) resolves conpty.dll and
          # OpenConsole.exe from prebuilds/<platform>-<arch>/conpty/, next to
          # conpty.node (see shouldEnableConptyDll in src/pty-manager.ts). The
          # arm64-prebuilds release asset has them flat, so copy the conpty/
          # subdir that the npm node-pty tarball ships (issue #105: without it
          # spawn fails with "Cannot find conpty.dll").
          cp -r "$SRC/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/conpty" "$PKG/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/"

          # Fail loudly - a silent absence would break spawn for ARM64 users.
          CONPTY_DEST="$PKG/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/conpty"
          if [ ! -f "$CONPTY_DEST/conpty.dll" ] || [ ! -f "$CONPTY_DEST/OpenConsole.exe" ]; then
            echo "ERROR: $CONPTY_DEST must contain conpty.dll and OpenConsole.exe (required by node-pty useConptyDll) - aborting build."
            exit 1
          fi

      - name: Package node-pty
        if: matrix.use-prebuilt != true
        shell: bash
        run: |
          SRC=staging/node_modules/node-pty
          PKG=$RUNNER_TEMP/node-pty-pkg

          mkdir -p "$PKG/lib"
          cp -r "$SRC/lib/"* "$PKG/lib/"
          cp "$SRC/package.json" "$PKG/"

          # Copy prebuilds (N-API binaries) if they exist for this platform
          if [ -d "$SRC/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}" ]; then
            mkdir -p "$PKG/prebuilds"
            cp -r "$SRC/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}" "$PKG/prebuilds/"
          fi

          # Fallback: copy node-gyp build output (Linux builds from source)
          if [ -d "$SRC/build/Release" ]; then
            mkdir -p "$PKG/build/Release"
            cp -r "$SRC/build/Release/"* "$PKG/build/Release/"
          fi

          # Windows: node-pty's useConptyDll resolves conpty.dll and
          # OpenConsole.exe from prebuilds/<platform>-<arch>/conpty/ (see
          # shouldEnableConptyDll in src/pty-manager.ts). Fail loudly if the
          # npm layout changes, otherwise the mouse fix would silently turn off.
          if [ "${{ matrix.platform }}" = "win32" ]; then
            CONPTY_DEST="$PKG/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/conpty"
            if [ ! -f "$CONPTY_DEST/conpty.dll" ] || [ ! -f "$CONPTY_DEST/OpenConsole.exe" ]; then
              echo "ERROR: $CONPTY_DEST must contain conpty.dll and OpenConsole.exe (required by node-pty useConptyDll) - aborting build."
              exit 1
            fi
          fi

      - name: Apply Windows patch
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          cp patches/windowsConoutConnection.js "$RUNNER_TEMP/node-pty-pkg/lib/windowsConoutConnection.js"

      - name: Create zip
        shell: bash
        run: |
          cd "$RUNNER_TEMP/node-pty-pkg"
          if command -v zip &> /dev/null; then
            zip -r "$GITHUB_WORKSPACE/node-pty-${{ matrix.platform }}-${{ matrix.arch }}.zip" .
          else
            # Compress-Archive with -Path '*' avoids nesting the parent directory name
            powershell -Command "Compress-Archive -Path '${{ runner.temp }}/node-pty-pkg/*' -DestinationPath '${{ github.workspace }}/node-pty-${{ matrix.platform }}-${{ matrix.arch }}.zip'"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: node-pty-${{ matrix.platform }}-${{ matrix.arch }}
          path: node-pty-${{ matrix.platform }}-${{ matrix.arch }}.zip

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: |
          echo "{" > checksums.json
          first=true
          for f in node-pty-*.zip; do
            hash=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$first" = true ]; then first=false; else echo "," >> checksums.json; fi
            printf '  "%s": "%s"' "$f" "$hash" >> checksums.json
          done
          echo "" >> checksums.json
          echo "}" >> checksums.json
          cat checksums.json

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.json
